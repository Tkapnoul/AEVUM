name: iPhone web app

# Publishes the app to GitHub Pages as a local-only home-screen app (no server: data stays on the phone).
# On iPhone: open https://<owner>.github.io/<repo>/ in Safari → Share → Add to Home Screen.
on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md", "docs/**", "wearables/**", "android/**", "ios/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build (local-only, served under /<repo>/)
        run: npx vite build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_LOCAL_ONLY: "1"

      # Client-side routes: GitHub Pages serves 404.html for unknown paths, so deep links still open the app.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      - name: Publish to the gh-pages branch
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
